name: Référence IOF (définitions de postes 2024)

on:
  workflow_dispatch: {}
  push:
    paths: [".github/workflows/iofref.yml"]

permissions:
  contents: write

jobs:
  ref:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Télécharger le PDF officiel IOF 2024
        run: |
          mkdir out
          for u in \
            "https://orienteering.sport/orienteering/wp-content/uploads/2023/09/IOF-Control-Descriptions-2024.pdf" \
            "https://www.orientierungslauf.ch/files/kommission_ausbildung/ausbildungsmaterial/iof-postenbeschreibungen/IOF_Control_Descriptions_2024_en.pdf" \
            "https://baoc.org/wiki/images/d/da/IOF_Control_Descriptions_2024.pdf" \
            "http://orienteering-sport.com/wp-content/uploads/IOF-Control-Descriptions-2024.pdf"; do
            curl -sSL -A "Mozilla/5.0" -o iof.pdf "$u" && file iof.pdf | grep -q PDF && echo "OK $u" && echo "$u" > out/source.txt && break
          done
          pdfinfo iof.pdf | head -5
          pdftoppm -r 100 -png iof.pdf out/page
          cp iof.pdf out/
      - name: Déposer dans la branche iof-ref
        run: |
          cd out
          git init -q -b iof-ref
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "IOF 2024 pages"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" iof-ref
