name: Chercher des photos libres (Wikimedia Commons)

on:
  workflow_dispatch: {}

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/photo_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: photos-candidates
          path: |
            candidates
            planches
