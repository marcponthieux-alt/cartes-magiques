name: Chercher des photos libres (Wikimedia Commons)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/photo_candidates.py
      - name: Déposer les candidates dans la branche photos-candidates
        run: |
          mkdir -p /tmp/out && cp -r candidates planches /tmp/out/
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan photos-candidates
          git rm -rf . -q
          cp -r /tmp/out/* .
          git add candidates planches
          git commit -q -m "Photos candidates"
          git push -f origin photos-candidates
