name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Modèle vocal français hors connexion (Vosk)
        run: |
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-fr
          mv vosk-model-small-fr-0.22 app/src/main/assets/model-fr
          echo "fr-0.22-${GITHUB_SHA}" > app/src/main/assets/model-fr/uuid

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk cartes-magiques.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cartes-magiques-apk
          path: cartes-magiques.apk

      - name: Publier dans « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Une fiche par version ; le lien « latest » pointe toujours vers la plus récente.
          for k in 1 2 3; do
            gh release create "v${{ github.run_number }}" cartes-magiques.apk --latest \
              --title "Cartes magiques – version ${{ github.run_number }}" \
              --notes "Fichier à télécharger sur le téléphone : cartes-magiques.apk" && break
            sleep 20
          done
          # Ancien lien, mis à jour si GitHub le permet (sans bloquer).
          gh release upload derniere-version cartes-magiques.apk --clobber || true
